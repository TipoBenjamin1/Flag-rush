<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1024, initial-scale=1" />
  <title>Flag Rush Google Play Feature Graphic</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: #121417;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      color: #ffffff;
    }

    .feature {
      position: relative;
      width: 1024px;
      height: 500px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 16% 24%, rgba(38, 195, 154, 0.34), transparent 29%),
        radial-gradient(circle at 88% 18%, rgba(255, 192, 73, 0.32), transparent 28%),
        radial-gradient(circle at 74% 82%, rgba(64, 112, 255, 0.34), transparent 34%),
        linear-gradient(135deg, #10252f 0%, #18202d 43%, #291c31 100%);
    }

    .feature::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.13) 0 1px, transparent 1px 72px),
        linear-gradient(30deg, rgba(255, 255, 255, 0.07) 0 1px, transparent 1px 90px);
      opacity: 0.42;
      mix-blend-mode: screen;
    }

    .feature::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(5, 9, 14, 0.52), rgba(5, 9, 14, 0.08) 48%, rgba(5, 9, 14, 0.34));
    }

    .mode {
      position: absolute;
      width: 166px;
      height: 116px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 22px;
      box-shadow: 0 28px 56px rgba(0, 0, 0, 0.28);
      transform: rotate(var(--rotate));
      opacity: 0.92;
      z-index: 1;
    }

    .mode img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mode::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.2));
    }

    .mode--europe { left: 43px; top: 39px; --rotate: -10deg; }
    .mode--asia { right: 54px; top: 39px; --rotate: 9deg; }
    .mode--africa { left: 91px; bottom: 36px; --rotate: 8deg; }
    .mode--world { right: 83px; bottom: 35px; --rotate: -7deg; }

    .quiz-card {
      position: absolute;
      top: 110px;
      right: 24px;
      z-index: 4;
      width: 252px;
      height: 286px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 26px;
      background: rgba(17, 24, 39, 0.74);
      box-shadow: 0 32px 72px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(6px);
      transform: rotate(4deg);
    }

    .flag-panel {
      width: 100%;
      height: 118px;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
      background:
        linear-gradient(#005bbb 0 50%, #ffd500 50% 100%);
    }

    .question {
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 16px;
      font-weight: 750;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .answer {
      display: grid;
      place-items: center;
      height: 44px;
      margin-top: 12px;
      border-radius: 14px;
      background: #f7be3f;
      color: #16120a;
      font-size: 20px;
      font-weight: 900;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 15px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      font-weight: 800;
    }

    .copy {
      position: absolute;
      left: 92px;
      top: 118px;
      z-index: 5;
      width: 570px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 15px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.82);
      font-size: 14px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 19px;
      font-size: 82px;
      line-height: 0.92;
      font-weight: 950;
      letter-spacing: 0;
      text-shadow: 0 10px 35px rgba(0, 0, 0, 0.42);
    }

    h1 span {
      color: #ffc049;
    }

    .subhead {
      width: 430px;
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 25px;
      line-height: 1.18;
      font-weight: 780;
    }

    .chips {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .chip {
      display: grid;
      place-items: center;
      height: 42px;
      padding: 0 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 15px;
      font-weight: 850;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .chip--hot {
      background: #26c39a;
      color: #061813;
    }

    .spark {
      position: absolute;
      z-index: 3;
      width: 10px;
      height: 10px;
      border-radius: 99px;
      background: #ffffff;
      box-shadow: 0 0 28px #ffffff;
      opacity: 0.82;
    }

    .spark--a { left: 690px; top: 82px; }
    .spark--b { left: 840px; top: 250px; width: 7px; height: 7px; }
    .spark--c { left: 520px; top: 407px; width: 8px; height: 8px; }
  </style>
</head>
<body>
  <main class="feature" aria-label="Flag Rush Google Play feature graphic">
    <div class="mode mode--europe"><img src="../../src/assets/modes/europe.png" alt="" /></div>
    <div class="mode mode--asia"><img src="../../src/assets/modes/asia.png" alt="" /></div>
    <div class="mode mode--africa"><img src="../../src/assets/modes/africa.png" alt="" /></div>
    <div class="mode mode--world"><img src="../../src/assets/modes/world.png" alt="" /></div>

    <section class="copy">
      <div class="kicker">Fast geography quiz</div>
      <h1>Flag&nbsp;<span>Rush</span></h1>
      <p class="subhead">Guess flags, build streaks,<br />and master every region.</p>
      <div class="chips" aria-hidden="true">
        <div class="chip chip--hot">Blitz rounds</div>
        <div class="chip">Ranks & XP</div>
        <div class="chip">Country facts</div>
      </div>
    </section>

    <aside class="quiz-card" aria-hidden="true">
      <div class="flag-panel"></div>
      <div class="question">Guess the flag</div>
      <div class="answer">Ukraine</div>
      <div class="score-row">
        <span>Streak x8</span>
        <span>+120 XP</span>
      </div>
    </aside>

    <div class="spark spark--a"></div>
    <div class="spark spark--b"></div>
    <div class="spark spark--c"></div>
  </main>
</body>
</html>
