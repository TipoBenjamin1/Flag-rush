workflows:
  ios-simulator:
    name: Flag Rush iOS simulator check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app and sync iOS
        script: |
          npm run build
          npx cap sync ios
      - name: Build unsigned simulator app
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          mkdir -p build/ios-simulator
          APP_PATH=$(find build/DerivedData/Build/Products -name "App.app" -type d | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/ios-simulator/FlagRush-simulator.app.zip
    artifacts:
      - ios/App/build/ios-simulator/*.zip

  ios-unsigned-device:
    name: Flag Rush unsigned iPhoneOS build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app and sync iOS
        script: |
          npm run build
          npx cap sync ios
      - name: Build unsigned iPhoneOS app
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

          mkdir -p build/ios-unsigned/Payload
          APP_PATH=$(find build/DerivedData/Build/Products -name "App.app" -type d | head -n 1)
          cp -R "$APP_PATH" build/ios-unsigned/Payload/FlagRush.app
          cd build/ios-unsigned
          zip -qry FlagRush-unsigned.ipa Payload
          cd ../..
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/ios-unsigned/FlagRush-unsigned.app.zip
    artifacts:
      - ios/App/build/ios-unsigned/*.ipa
      - ios/App/build/ios-unsigned/*.zip

  ios-release:
    name: Flag Rush iOS App Store build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.flagrush
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app and sync iOS
        script: |
          npm run build
          npx cap sync ios
      - name: Apply Codemagic iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
